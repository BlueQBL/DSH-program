<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>流程探针 · 校样</title>
<style>
  body { margin: 0; background: #0d1117; color: #e4e8ef;
         font: 12px/1.65 "IBM Plex Mono", Consolas, monospace; }
  pre { margin: 0; padding: 16px 20px; white-space: pre-wrap; }
  iframe { position: fixed; left: -20000px; top: 0; border: 0; }
</style>
</head>
<body>
<!--
  流程探针（开发用，不是应用的一部分）
  把一个真实的 index.html 塞进 iframe，然后像用户那样动它：
  打字、切笔记、搜索、点勾选框、点印张段落、删笔记再撤销、
  上传图片、换主题、换 Markdown 风格、导出 ZIP。
  每一步都断言，结果写进下面的报告节点（id=out）。
  跑法见 scripts/shots.js（headless Chrome --dump-dom）。
-->
<iframe id="frame" src="../index.html" width="1440" height="900" title="被测页面"></iframe>
<pre id="out">跑流程…</pre>

<script>
'use strict';

const frame = document.getElementById('frame');
const out = document.getElementById('out');
const results = [];
const errors = [];

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/** 等某个条件成立（图库是异步的，固定 sleep 靠不住） */
async function waitFor(fn, timeout, label) {
  const limit = timeout || 3000;
  let waited = 0;
  while (waited <= limit) {
    try { if (fn()) return true; } catch { /* 元素还没出现，接着等 */ }
    await wait(50);
    waited += 50;
  }
  return false;
}

const round = (n) => Math.round(n * 10) / 10;

function check(label, condition, detail) {
  results.push({ step: label, ok: Boolean(condition), detail: detail === undefined ? '' : String(detail) });
}

/** 每进一段就在报告节点上盖个章：万一被虚拟时钟截断，dump 出来也知道卡在哪 */
function mark(step) {
  out.dataset.step = step;
  out.textContent = '跑流程… 当前：' + step;
}

function fire(el, type) {
  el.dispatchEvent(new frame.contentWindow.Event(type, { bubbles: true }));
}

/** 报告三写：POST 给本地服务（最可靠，探针被 kill 也不丢）、写 DOM、写 localStorage */
function publish(report) {
  const text = JSON.stringify(report, null, 1);
  out.textContent = text;
  try { frame.contentWindow.localStorage.setItem('mdprobe:flow', text); } catch { /* 存不下就算了 */ }
  try {
    fetch('/__probe-report/flow', { method: 'POST', body: text }).catch(() => {});
  } catch { /* 老浏览器没有 fetch 也无所谓，还有另外两条路 */ }
}

async function run() {
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  const $ = (sel) => doc.querySelector(sel);
  const $$ = (sel) => Array.prototype.slice.call(doc.querySelectorAll(sel));
  const stored = () => JSON.parse(win.localStorage.getItem('markdown-notes/v1') || '{}');

  // 关掉所有过渡/动画：否则量到的是过渡中间态（虚拟时钟下过渡可能根本不动），
  // 那是探针的问题，不是界面的问题
  const freeze = doc.createElement('style');
  freeze.textContent = '*, *::before, *::after { transition: none !important; animation: none !important; }';
  doc.head.appendChild(freeze);

  // 平滑滚动在虚拟时钟下同样可能不动，这里换成"立即到位"，只验"滚到哪儿"这件事
  const scrollCalls = [];
  win.Element.prototype.scrollTo = function (arg) {
    if (arg && typeof arg === 'object' && typeof arg.top === 'number') {
      scrollCalls.push(arg.top);
      this.scrollTop = arg.top;
    }
  };

  await wait(900);

  /* 0. 启动 */
  mark('启动就绪');
  const booted = await waitFor(() => doc.documentElement.dataset.ready === 'true', 6000, '应用就绪');
  check('启动：应用跑完初始化（图库是异步的，先画后补）', booted,
    doc.documentElement.dataset.ready || '没等到 data-ready');
  check('启动：目录栏渲染出笔记', $$('.card').length === 2, $$('.card').length + ' 张卡片');
  check('启动：编辑器有内容', ($('#editor') || {}).value.length > 100);
  check('启动：印张渲染出块', $$('#preview [data-line]').length > 10, $$('#preview [data-line]').length + ' 个块');
  check('启动：印张没有被滚过头', ($('#proofScroll') || {}).scrollTop === 0, 'scrollTop=' + ($('#proofScroll') || {}).scrollTop);
  check('启动：代码块高亮生效', $$('#preview .tk').length > 5, $$('#preview .tk').length + ' 个 token');
  check('启动：种子笔记里的公式渲染成 MathML', $$('#preview math').length >= 1, $$('#preview math').length + ' 个');
  check('启动：种子笔记里的脚注排出来了', Boolean($('#preview .md-footnotes')));

  const copyBtn = $$('.md-codeblock__copy')[0];
  check('启动：代码卡片带复制按钮', Boolean(copyBtn));
  if (copyBtn) {
    copyBtn.click();
    // 剪贴板 API 没响应时有 800ms 兜底判决，所以这里要等够
    await wait(1400);
    check('代码卡片：点复制给出反馈', $$('.toast').length > 0,
      $$('.toast').map((t) => t.textContent).join(' / ').slice(0, 40));
  }

  /* 1. 打字 → 实时预览 */
  mark('1 打字与实时预览');
  const editor = $('#editor');
  const before = editor.value;
  editor.value = before + '\n\n## 探针小标题\n\n探针写进去的一段话。\n';
  fire(editor, 'input');

  check('打字后：状态栏给出保存反馈',
    /待保存|已保存/.test($('#saveState').textContent),
    $('#saveState').textContent);

  await wait(300);
  const h2 = $$('#preview h2').find((el) => el.textContent.indexOf('探针小标题') >= 0);
  check('实时预览：新标题出现在印张上', Boolean(h2));
  const wantLine = editor.value.slice(0, editor.value.indexOf('## 探针小标题')).split('\n').length;
  check('实时预览：行号映射正确（光标联动的前提）',
    h2 && Number(h2.dataset.line) === wantLine,
    h2 ? 'data-line=' + h2.dataset.line + ' 期望 ' + wantLine : '没找到');

  await wait(700);
  check('落盘：状态变成已保存', ($('#saveState').textContent || '').indexOf('已保存') >= 0, $('#saveState').textContent);
  const saved = stored();
  const active = (saved.notes || []).find((n) => n.id === saved.activeId);
  check('落盘：LocalStorage 里真的有这段话',
    active && active.body.indexOf('探针小标题') >= 0,
    active ? '正文 ' + active.body.length + ' 字' : '没读到');

  /* 2. 光标 ↔ 印张 */
  mark('2 光标联动');
  const paraLine = editor.value.slice(0, editor.value.indexOf('探针写进去的一段话')).split('\n').length;
  const paraStart = editor.value.split('\n').slice(0, paraLine - 1).join('\n').length + (paraLine > 1 ? 1 : 0);
  editor.setSelectionRange(paraStart + 2, paraStart + 2);
  fire(editor, 'click');
  await wait(250);

  const cursorBlock = $('#preview .is-cursor');
  const tick = $('#tickCursor');
  check('光标联动：印张里点亮了对应段落',
    cursorBlock && Number(cursorBlock.dataset.line) === paraLine,
    cursorBlock ? cursorBlock.tagName + ' data-line=' + cursorBlock.dataset.line + ' 期望 ' + paraLine : '没有点亮的块');
  check('光标联动：页边红括号显示', tick && tick.className.indexOf('is-on') >= 0);
  if (cursorBlock) {
    const br = cursorBlock.getBoundingClientRect();
    const tr = tick.getBoundingClientRect();
    check('光标联动：括号与段落对齐',
      Math.abs(br.top - tr.top) <= 2 && Math.abs(br.height - tr.height) <= 2,
      'block ' + round(br.top) + '/' + round(br.height) + '  tick ' + round(tr.top) + '/' + round(tr.height));
  }

  /* 3. 反向：点印张里的块 → 光标回源码 */
  mark('3 反向定位');
  const target = $$('#preview p')[1] || $$('#preview [data-line]')[2];
  const targetLine = Number(target.dataset.line);
  target.click();
  await wait(120);
  const caretLine = editor.value.slice(0, editor.selectionStart).split('\n').length;
  check('反向定位：点印张的块，光标跳到那一行',
    caretLine === targetLine && doc.activeElement === editor,
    '光标在第 ' + caretLine + ' 行，目标第 ' + targetLine + ' 行');

  /* 4. 勾选框回写原文 */
  mark('4 勾选框回写');
  const box = $$('#preview .md-check').find((el) => !el.checked);
  const lineOfBox = Number(box.dataset.toggleLine);
  const lineBefore = editor.value.split('\n')[lineOfBox - 1];
  box.click();
  await wait(200);
  const lineAfter = $('#editor').value.split('\n')[lineOfBox - 1];
  check('勾选框：点印张的勾会改回左边原文',
    /\[[xX]\]/.test(lineAfter) && /\[ \]/.test(lineBefore),
    '"' + lineBefore.trim() + '" → "' + lineAfter.trim() + '"');
  check('勾选框：改完立刻落盘',
    (stored().notes.find((n) => n.id === stored().activeId) || {}).body.split('\n')[lineOfBox - 1].indexOf('[x]') >= 0);

  /* 5. 搜索 */
  mark('5 搜索');
  const search = $('#search');
  search.value = '速查';
  fire(search, 'input');
  await wait(150);
  check('搜索：筛出命中项', $$('.card').length === 1, $$('.card').length + ' 张卡片');
  check('搜索：关键词被标出来', $$('.card mark').length >= 1, $$('.card mark').length + ' 处标记');
  const miss = $('#search');
  miss.value = '压根不存在的词';
  fire(miss, 'input');
  await wait(150);
  check('搜索：查不到时给出空状态', Boolean($('.rail__empty')), $('.rail__empty') ? $('.rail__empty').textContent.slice(0, 18) : '没有空状态');
  $('#searchClear').click();
  await wait(150);
  check('搜索：清空后恢复全部', $$('.card').length === 2, $$('.card').length + ' 张卡片');

  /* 6. 切换笔记 */
  mark('6 切换笔记');
  const firstBody = $('#editor').value;
  const other = $$('.card').find((c) => c.dataset.active !== 'true');
  other.querySelector('.card__open').click();
  await wait(400);
  check('切换：编辑器换成了另一篇', $('#editor').value !== firstBody);
  check('切换：卡片选中态跟着走',
    $('.card[data-active="true"]').dataset.id === other.dataset.id);
  check('切换：印张重排为新笔记', $$('#preview [data-line]').length > 5);

  /* 7. 删除 → 撤销 */
  mark('7 删除与撤销');
  const activeId = $('.card[data-active="true"]').dataset.id;
  const titleOfActive = $('.card[data-active="true"] .card__title').textContent.trim();
  const cardsBefore = $$('.card').length;
  $('.card[data-active="true"] .card__del').click();
  await wait(250);
  check('删除：卡片少一张', $$('.card').length === cardsBefore - 1, $$('.card').length + ' 张');
  check('删除：LocalStorage 里也没了',
    !stored().notes.some((n) => n.id === activeId));
  const undo = $('.toast .toast__act');
  check('删除：给出撤销入口', Boolean(undo), undo ? undo.textContent : '没有撤销按钮');
  if (undo) {
    undo.click();
    await wait(250);
    check('撤销：笔记回来了', $$('.card').length === cardsBefore && stored().notes.some((n) => n.id === activeId));
    check('撤销：标题还是原来那篇',
      $$('.card').some((c) => c.querySelector('.card__title').textContent.trim() === titleOfActive));
  }

  /* 8. 新建 */
  mark('8 新建笔记');
  $('#newNote').click();
  await wait(300);
  check('新建：多了一张卡片', $$('.card').length === cardsBefore + 1, $$('.card').length + ' 张');
  check('新建：标题输入框拿到焦点', doc.activeElement === $('#title'));
  check('新建：正文是空的', $('#editor').value === '');
  check('新建：印张给出"还没写"的提示',
    Boolean($('#preview .page__hint')) && $$('#preview [data-line]').length === 0,
    $('#preview').textContent.trim().slice(0, 20));
  check('新建：立刻落盘', stored().notes.length === cardsBefore + 1);

  /* 9. 工具栏 */
  mark('9 工具栏');
  $('#editor').value = '加粗测试';
  $('#editor').setSelectionRange(0, 2);
  fire($('#editor'), 'input');
  doc.querySelector('[data-md="bold"]').click();
  await wait(300);
  check('工具栏：选中文字加粗', $('#editor').value === '**加粗**测试', $('#editor').value);
  check('工具栏：印张里出现 strong', Boolean($('#preview strong')), $('#preview').innerHTML.length + ' 字符的 HTML');

  /* 9.5 标题：编辑页有标题，印张上也得有 */
  mark('9.5 标题归属');
  const titleInput = $('#title');
  titleInput.value = '探针标题';
  fire(titleInput, 'input');
  await wait(300);
  let pageTitle = $('#preview .page__title');
  check('标题：正文没写标题时，印张把标题框的字排出来',
    Boolean(pageTitle) && pageTitle.textContent.trim() === '探针标题',
    pageTitle ? '「' + pageTitle.textContent.trim() + '」' : '印张上没有标题');
  check('标题：排在正文最前面',
    Boolean(pageTitle) && $('#preview').firstElementChild === pageTitle);
  if (pageTitle) {
    pageTitle.click();
    await wait(120);
    check('标题：点印张上的标题，光标回到标题框',
      doc.activeElement === titleInput,
      String(doc.activeElement && doc.activeElement.id));
  }

  $('#editor').value = '# 正文里的一级标题\n\n正文';
  fire($('#editor'), 'input');
  await wait(300);
  pageTitle = $('#preview .page__title');
  check('标题：正文自带一级标题时不再重复排一次',
    !pageTitle && $('#preview h1') && $('#preview h1').textContent.indexOf('正文里的一级标题') >= 0,
    $('#preview').textContent.trim().slice(0, 24));
  check('标题：这种时候导出的 .md 不会多插一行（第一行就是正文的标题）',
    $('#editor').value.split('\n')[0] === '# 正文里的一级标题',
    $('#editor').value.split('\n')[0]);
  check('标题：标签页标题跟着笔记走（也就是打印时的默认文件名）',
    doc.title.indexOf('探针标题') === 0,
    doc.title);

  /* 9.6 大纲 / 公式 / 脚注：写一篇像样的文档再验 */
  mark('9.6 大纲公式脚注');
  const richDoc = [
    '# 一级标题',
    '',
    '一段中英混排 React 的文字。',
    '',
    '## 二级标题',
    '',
    '$$',
    'E = mc^2',
    '$$',
    '',
    '正文带一个脚注[^n]。',
    '',
    '[^n]: 脚注说明文字',
    '',
    '## 另一个标题',
  ].join('\n');
  $('#editor').value = richDoc;
  fire($('#editor'), 'input');
  await wait(400);

  check('公式：块级公式渲染成 MathML',
    $$('#preview .md-math--block math').length === 1,
    $$('#preview math').length + ' 个 math 元素');
  check('公式：带上了 TeX 注解（可再编辑）',
    Boolean($('#preview annotation[encoding="application/x-tex"]')));
  check('脚注：正文里有引用、文末有脚注区',
    $$('#preview .fn-ref').length === 1 && Boolean($('#preview .md-footnotes')));
  check('脚注：引用处自动编号为 1',
    ($('#preview .fn-ref a') || {}).textContent === '1',
    ($('#preview .fn-ref a') || {}).textContent);

  const hashBefore = win.location.hash;
  $('#preview .fn-ref a').click();
  await wait(300);
  check('脚注：点引用跳到脚注，且不动地址栏', win.location.hash === hashBefore, win.location.hash);

  const outlineItems = () => $$('#outline .outline__item');
  check('大纲：自动收集到三个标题', outlineItems().length === 3, outlineItems().length + ' 条');
  check('大纲：页签上显示条数', $('#tabBadgeOutline').textContent === '3', $('#tabBadgeOutline').textContent);
  check('大纲：层级缩进按标题级别来',
    outlineItems()[1].style.getPropertyValue('--indent') === '1',
    '第二条缩进 ' + outlineItems()[1].style.getPropertyValue('--indent'));

  doc.querySelector('[data-tab="outline"]').click();
  await wait(120);
  check('大纲：页签能切到面板',
    $('.rail__panel[data-panel="outline"]').hidden === false &&
    $('.rail__panel[data-panel="notes"]').hidden === true);
  $('#proofScroll').scrollTop = 0;
  scrollCalls.length = 0;
  outlineItems()[2].click();
  await wait(400);
  check('大纲：点一条能跳到对应章节',
    $('#proofScroll').scrollTop > 0 || scrollCalls.length > 0,
    'scrollTop=' + Math.round($('#proofScroll').scrollTop) + ' scrollTo 调用=' + scrollCalls.length);
  check('大纲：跳到的地方闪一下作提示', $$('#preview .is-flash').length >= 1);
  doc.querySelector('[data-tab="notes"]').click();
  await wait(120);

  /* 9.7 图片：走一遍"上传 → 插图 → 预览 → 删除 → 撤销" */
  mark('9.7 图片上传');
  const pngBase64 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFAAH/q842iQAAAABJRU5ErkJggg==';
  const pngBytes = Uint8Array.from(win.atob(pngBase64), (c) => c.charCodeAt(0));
  const imageFile = new win.File([pngBytes], '探针图.png', { type: 'image/png' });
  const dt = new win.DataTransfer();
  dt.items.add(imageFile);
  const imageInput = $('#imageInput');
  imageInput.files = dt.files;
  fire(imageInput, 'change');
  const storedOk = await waitFor(() => $$('#imageGrid .image-card').length === 1, 5000, '图片进库');
  check('图片：上传后进了这篇笔记的图库', storedOk, $$('#imageGrid .image-card').length + ' 张');
  await waitFor(() => $$('#preview img').length === 1, 3000, '印张出图');

  check('图片：正文里插入了图片语法',
    $('#editor').value.indexOf('![探针图](探针图.png)') >= 0,
    $('#editor').value.split('\n').filter((l) => l.indexOf('![') >= 0).join(' / ').slice(0, 40));
  check('图片：印张里渲染出 img', $$('#preview img').length === 1, $$('#preview img').length + ' 张');
  const imgEl = $('#preview img');
  check('图片：用的是本地对象地址，不是外链',
    Boolean(imgEl) && /^blob:/.test(imgEl.getAttribute('src') || ''),
    imgEl ? String(imgEl.getAttribute('src')).slice(0, 24) : '没有 img');

  doc.querySelector('[data-tab="images"]').click();
  await wait(200);
  check('图片：页签徽标显示张数', $('#tabBadgeImages').textContent === '1', $('#tabBadgeImages').textContent);
  check('图片：面板里列出了这张图', $$('#imageGrid .image-card').length === 1,
    $('#imageGrid') ? $('#imageGrid').textContent.trim().slice(0, 40) : '没有面板');
  check('图片：目录名就是笔记标题',
    $('#imageFolder').textContent.trim() === '探针标题',
    $('#imageFolder').textContent);
  const sizeText = $('#imageGrid .image-card__size');
  check('图片：标注了引用次数',
    Boolean(sizeText) && sizeText.textContent.indexOf('引用 1 处') >= 0,
    sizeText ? sizeText.textContent : '没有这张图');

  // 编辑时也能看到图：稿纸栏底部那条缩略图带
  check('图片：编辑栏出现「本文图片」缩略图带',
    $('#imageStrip').hidden === false && $$('#imageStripItems .strip__item').length === 1,
    $$('#imageStripItems .strip__item').length + ' 个缩略图');
  check('图片：缩略图标了"已被引用"',
    ($('#imageStripItems .strip__item') || { dataset: {} }).dataset.used === 'true');
  const stripBtn = $('#imageStripItems .strip__item');
  if (stripBtn) {
    $('#editor').setSelectionRange(0, 0);
    const lineBefore = $('#editor').value.slice(0, $('#editor').selectionStart).split('\n').length;
    stripBtn.click();
    await wait(250);
    const lineAfter = $('#editor').value.slice(0, $('#editor').selectionStart).split('\n').length;
    check('图片：点缩略图跳到引用它的那一行', lineAfter !== lineBefore,
      '第 ' + lineBefore + ' 行 → 第 ' + lineAfter + ' 行');
  }

  const removeBtn = doc.querySelector('#imageGrid [data-image-act="remove"]');
  check('图片：面板里有删除按钮', Boolean(removeBtn));
  if (removeBtn) {
    removeBtn.click();
    await waitFor(() => $$('#imageGrid .image-card').length === 0, 3000, '图片删除');
    check('图片：删除后列表空了', $$('#imageGrid .image-card').length === 0);
    check('图片：正文里的引用变成"缺图"占位', $$('#preview .md-img-missing').length === 1);
    const imgUndo = $$('.toast .toast__act').pop();
    check('图片：删除给了撤销入口', Boolean(imgUndo) && imgUndo.textContent === '撤销');
    if (imgUndo) {
      imgUndo.click();
      await waitFor(() => $$('#imageGrid .image-card').length === 1, 4000, '图片恢复');
      check('图片：撤销后图片回来了', $$('#imageGrid .image-card').length === 1);
      check('图片：印张里又能看到了', $$('#preview img').length === 1);
    }
  }
  doc.querySelector('[data-tab="notes"]').click();
  await wait(120);

  /* 9.8 主题与风格 */
  mark('9.8 主题与风格');
  $('#settingsBtn').click();
  await wait(150);
  check('设置：弹层能打开', $('#settings').hidden === false);

  /* 9.9 导出：ZIP 真打一份出来看目录结构；PDF 交给打印引擎，这里只验样式 */
  mark('9.9 导出');
  const captured = [];
  const origCreate = win.URL.createObjectURL;
  win.URL.createObjectURL = function (blob) {
    captured.push(blob);
    return origCreate.call(win.URL, blob);
  };
  $('#editor').value = richDoc + '\n\n![探针图](探针图.png)\n';

  check('导出：PDF 走打印引擎，打印样式里排掉了界面',
    (() => {
      for (let i = 0; i < doc.styleSheets.length; i += 1) {
        let rules;
        try { rules = doc.styleSheets[i].cssRules; } catch { continue; }
        for (let k = 0; k < rules.length; k += 1) {
          const rule = rules[k];
          if (rule.type === win.CSSRule.MEDIA_RULE && /print/.test(rule.conditionText || rule.media.mediaText || '')) {
            const text = rule.cssText || '';
            if (text.indexOf('.rail') >= 0 && text.indexOf('.md-codeblock') >= 0) return true;
          }
        }
      }
      return false;
    })());

  $('#exportZip').click();
  await waitFor(() => captured.some((b) => b && b.type === 'application/zip'), 4000, 'ZIP 产出');
  const zipBlob = captured.filter((b) => b && b.type === 'application/zip')[0];
  check('导出：ZIP 真的产出了', Boolean(zipBlob), captured.map((b) => b.type).join(',') || '没有捕获到');
  if (zipBlob) {
    const bytes = new Uint8Array(await zipBlob.arrayBuffer());
    const hasBytes = (needle) => {
      outer:
      for (let i = 0; i + needle.length <= bytes.length; i += 1) {
        for (let k = 0; k < needle.length; k += 1) {
          if (bytes[i + k] !== needle[k]) continue outer;

        return true;

    check('导出：ZIP 头是 PK', bytes[0] === 0x50 && bytes[1] === 0x4b, bytes[0] + ',' + bytes[1]);

  }

  check('拆围栏：大纲跟着长出来', $$('#outline .outline__item').length >= 1,
    $$('#outline .outline__item').length + ' 条');

  /* 10. 把笔记全删光 → 两栏都该让位给空状态 */
  mark('10 删光笔记');

  while ($('.card') && guard < 12) {
    $('.card .card__del').click();

  check('删光：稿纸栏让位给邀请', $('#sourceBlank').hidden === false);
  check('删光：印张栏让位给邀请', $('#proofBlank').hidden === false);
  check('删光：LocalStorage 里确实空了', (stored().notes || []).length === 0, (stored().notes || []).length + ' 篇');

  /* 11. 分栏与偏好 */

  await wait(120);
  check('排序：按钮状态切换', doc.querySelector('[data-sort="title"]').getAttribute('aria-pressed') === 'true');
  const ui = JSON.parse(win.localStorage.getItem('markdown-notes/ui/v1') || '{}');
  check('偏好：排序方式写进 LocalStorage', ui.sort === 'title', JSON.stringify(ui));
  const follow = $('#follow');

  check('偏好：跟随光标开关可关',

  check('偏好：主题也记着',
    JSON.parse(win.localStorage.getItem('markdown-notes/ui/v1') || '{}').theme === 'proof');
  check('窄屏切换条：宽屏下隐藏',
    win.getComputedStyle($('.panes')).display === 'none', win.getComputedStyle($('.panes')).display);

/**
 * 不依赖 iframe 的 load 事件：外面那张 Google Fonts 样式表偶尔会挂住，
 * load 事件就一直不来，探针会"跑都没跑"然后被判成失败。
 * 所以改成轮询：文档在、应用就绪（或至少已经有卡片）就开始。
 */
async function waitForApp() {
  for (let i = 0; i < 120; i += 1) {
    try {
      const doc = frame.contentDocument;
      if (doc && doc.documentElement && doc.documentElement.dataset.ready === 'true') return true;
      if (doc && doc.querySelectorAll('.card').length > 0) return true;
    } catch { /* 还没文档，接着等 */ }
    await wait(250);
  }
  return false;
}

waitForApp().then((ok) => {
  if (!ok) {
    publish({ summary: { crashed: '被测页面 30 秒内没就绪' }, windowErrors: errors, results: results });
    return;
  }
  win_err_hook();
  setTimeout(() => {
    run().then(() => {
      const failed = results.filter((r) => !r.ok);
      publish({
        summary: { total: results.length, passed: results.length - failed.length, failed: failed.length },
        windowErrors: errors,
        results: results,
      });
    }).catch((err) => {
      publish({
        summary: { total: results.length, crashed: String(err && err.stack ? err.stack : err) },
        windowErrors: errors,
        results: results,
      });
    });
  }, 400);
});

function win_err_hook() {
  try {
    frame.contentWindow.addEventListener('error', (e) => errors.push(String(e.message)));
    frame.contentWindow.addEventListener('unhandledrejection', (e) => errors.push('promise: ' + e.reason));
  } catch { /* 挂不上就算了 */ }
}

setTimeout(() => {
  if (/跑流程…/.test(out.textContent)) {
    // 到点了还没跑完：把卡在哪一段写清楚，别让人对着空白猜
    publish({
      summary: { crashed: '流程没跑完，卡在：' + (out.dataset.step || '未知') },
      windowErrors: errors,
      results: results,
    });
  }
}, 22000);
</script>
